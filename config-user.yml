config:
  backup: true
  banner: false
  create: true
  dotpath: user
  keepdot: false
  link_dotfile_default: nolink
  link_on_import: nolink
  longkey: false
  showdiff: true
# Configs the applications rewrite themselves: $HOME is stored as @HOME@, and
# state like recent files or last used folders is dropped on update, so it
# never reaches the repo (see scripts/dotdrop-trans)
trans_install:
  home_in: '"{{@@ dirname(_dotdrop_cfgpath) @@}}/scripts/dotdrop-trans" install "{0}" "{1}"'
trans_update:
  home_out: '"{{@@ dirname(_dotdrop_cfgpath) @@}}/scripts/dotdrop-trans" update "{0}" "{1}"'
  keepassxc_out: '"{{@@ dirname(_dotdrop_cfgpath) @@}}/scripts/dotdrop-trans" update "{0}" "{1}" --drop-section KeeShare'
  prusaslicer_out: '"{{@@ dirname(_dotdrop_cfgpath) @@}}/scripts/dotdrop-trans" update "{0}" "{1}" --drop last_output_path --drop-section recent --drop-section recent_projects'
  qbittorrent_out: '"{{@@ dirname(_dotdrop_cfgpath) @@}}/scripts/dotdrop-trans" update "{0}" "{1}" --drop LastAddPath --drop "Downloads\ScanDirsLastPath" --drop "Session\Port"'
dotfiles:
  d_blender:
    src: config/blender
    dst: ~/.config/blender
    cmpignore:
      - '*'
      - '!*.blend'
      - '*/scripts/**'
    upignore:
      - '*'
      - '!*.blend'
      - '*/scripts/**'
  d_btop:
    src: config/btop
    dst: ~/.config/btop
    upignore:
      - btop.log
    cmpignore:
      - btop.log
  d_config_oh-my-zsh_plugins:
    src: config/oh-my-zsh/plugins
    dst: ~/.config/oh-my-zsh/plugins
    link: link_children
  d_config_oh-my-zsh_themes:
    src: config/oh-my-zsh/themes
    dst: ~/.config/oh-my-zsh/themes
    link: link_children
  d_gtk-2.0:
    src: config/gtk-2.0
    dst: ~/.config/gtk-2.0
    trans_install: home_in
    trans_update: home_out
    chmod: '700'
  d_gtk-3.0:
    src: config/gtk-3.0
    dst: ~/.config/gtk-3.0
    trans_install: home_in
    trans_update: home_out
    chmod: '700'
  d_hypr:
    src: config/hypr
    dst: ~/.config/hypr
    # Deployed per host, see f_hypr_host_*
    cmpignore:
      - host.lua
      - hyprlock-host.conf
    upignore:
      - host.lua
      - hyprlock-host.conf
  d_local_share_ulauncher_extensions:
    src: local/share/ulauncher/extensions
    dst: ~/.local/share/ulauncher/extensions
    link: link_children
  d_mpv:
    src: config/mpv
    dst: ~/.config/mpv
  d_oh-my-zsh:
    src: oh-my-zsh
    dst: ~/.local/share/oh-my-zsh
    link: absolute
  d_openrgb:
    src: config/OpenRGB
    dst: ~/.config/OpenRGB
    upignore:
      - logs/*
    cmpignore:
      - logs/*
  d_plugged:
    src: vim/plugged
    dst: ~/.vim/plugged
    link: link_children
  d_qt5ct:
    src: config/qt5ct
    dst: ~/.config/qt5ct
  d_ranger:
    src: config/ranger
    dst: ~/.config/ranger
  d_rofi:
    src: config/rofi
    dst: ~/.config/rofi
  d_systemd:
    src: config/systemd
    dst: ~/.config/systemd
    # media-sync-mk3s.service is deployed per host, see f_media-sync-mk3s_*
    instignore:
      - '*.wants'
    upignore:
      - '*.wants'
      - user/media-sync-mk3s.service
    cmpignore:
      - '*.wants'
      - user/media-sync-mk3s.service
  d_ulauncher:
    src: config/ulauncher
    dst: ~/.config/ulauncher
    upignore:
      - user-themes/*
    cmpignore:
      - user-themes/*
  d_ulauncher_themes:
    src: config/ulauncher/user-themes
    dst: ~/.config/ulauncher/user-themes
    link: link_children
  d_waybar:
    src: config/waybar
    dst: ~/.config/waybar
  d_wofi:
    src: config/wofi
    dst: ~/.config/wofi
  d_xfce4:
    src: config/xfce4
    dst: ~/.config/xfce4
    trans_install: home_in
    trans_update: home_out
    chmod: '700'
  d_zsh:
    src: config/zsh
    dst: ~/.config/zsh
    # host.zsh is deployed per host, see f_zsh_host_*
    upignore:
      - .zcompdump
      - host.zsh
    cmpignore:
      - .zcompdump
      - host.zsh
  f_bashrc:
    src: bashrc
    dst: ~/.bashrc
  f_code-flags.conf:
    src: config/code-flags.conf
    dst: ~/.config/code-flags.conf
  f_config.conf:
    src: config/neofetch/config.conf
    dst: ~/.config/neofetch/config.conf
  f_config.json:
    src: config/swaync/config.json
    dst: ~/.config/swaync/config.json
  f_dmrc:
    src: dmrc
    dst: ~/.dmrc
  f_electron-flags.conf:
    src: config/electron-flags.conf
    dst: ~/.config/electron-flags.conf
  f_electron13-flags.conf:
    src: config/electron13-flags.conf
    dst: ~/.config/electron13-flags.conf
  f_aur-audit:
    src: local/bin/aur-audit
    dst: ~/.local/bin/aur-audit
    chmod: '755'
  f_extract-audio-streams:
    src: local/bin/extract-audio-streams
    dst: ~/.local/bin/extract-audio-streams
    chmod: '755'
  f_flameshot_config:
    src: config/flameshot/flameshot.ini
    dst: ~/.config/flameshot/flameshot.ini
    trans_install: home_in
    trans_update: home_out
  f_get-iommu-groups:
    src: local/bin/get-iommu-groups
    dst: ~/.local/bin/get-iommu-groups
    chmod: '755'
  f_gitconfig:
    src: config/git/config
    dst: ~/.config/git/config
  f_gitconfig_desktop:
    src: config/git/desktop
    dst: ~/.config/git/desktop
  f_htoprc:
    src: config/htop/htoprc
    dst: ~/.config/htop/htoprc
  f_hypr_host_mia:
    src: hosts/mia/hypr/host.lua
    dst: ~/.config/hypr/host.lua
  f_hypr_host_mia_hyprlock:
    src: hosts/mia/hypr/hyprlock-host.conf
    dst: ~/.config/hypr/hyprlock-host.conf
  f_hypr_xkb_reset:
    src: local/bin/hypr_xkb_reset
    dst: ~/.local/bin/hypr_xkb_reset
    chmod: '744'
  f_hyprlock-recover:
    src: local/bin/hyprlock-recover
    dst: ~/.local/bin/hyprlock-recover
    chmod: '744'
  f_index.theme:
    src: icons/default/index.theme
    dst: ~/.icons/default/index.theme
  f_keepassxc.ini:
    src: config/keepassxc/keepassxc.ini
    dst: ~/.config/keepassxc/keepassxc.ini
    trans_update: keepassxc_out
  f_kitty.conf:
    src: config/kitty/kitty.conf
    dst: ~/.config/kitty/kitty.conf
  f_kvantum.kvconfig:
    src: config/Kvantum/kvantum.kvconfig
    dst: ~/.config/Kvantum/kvantum.kvconfig
  f_lutris.conf:
    src: config/lutris/lutris.conf
    dst: ~/.config/lutris/lutris.conf
  f_media-sync-mk3s_mia:
    src: hosts/mia/systemd/media-sync-mk3s.service
    dst: ~/.config/systemd/user/media-sync-mk3s.service
  f_mimeapps.list:
    src: config/mimeapps.list
    dst: ~/.config/mimeapps.list
    chmod: '644'
  f_p10k.zsh:
    src: p10k.zsh
    dst: ~/.p10k.zsh
  f_pavucontrol.ini:
    src: config/pavucontrol.ini
    dst: ~/.config/pavucontrol.ini
  f_plug.vim:
    src: vim/autoload/plug.vim
    dst: ~/.vim/autoload/plug.vim
  f_prusaslicer.ini:
    src: config/PrusaSlicer/PrusaSlicer.ini
    dst: ~/.config/PrusaSlicer/PrusaSlicer.ini
    trans_install: home_in
    trans_update: prusaslicer_out
  f_prusaslicergcodeviewer.ini:
    src: config/PrusaSlicer/PrusaSlicerGcodeViewer.ini
    dst: ~/.config/PrusaSlicer/PrusaSlicerGcodeViewer.ini
    trans_install: home_in
    trans_update: prusaslicer_out
  f_pythonrc:
    src: config/python/pythonrc
    dst: ~/.config/python/pythonrc
  f_qbittorrent-natpmp:
    src: local/bin/qbittorrent-natpmp
    dst: ~/.local/bin/qbittorrent-natpmp
    chmod: '755'
  f_qbittorrent.conf:
    src: config/qBittorrent/qBittorrent.conf
    dst: ~/.config/qBittorrent/qBittorrent.conf
    trans_install: home_in
    trans_update: qbittorrent_out
  f_shell:
    src: shell
    dst: ~/.shell
  f_sunsetr.toml:
    src: config/sunsetr/sunsetr.toml
    dst: ~/.config/sunsetr/sunsetr.toml
  f_swappy_config:
    src: config/swappy/config
    dst: ~/.config/swappy/config
  f_uca.xml:
    src: config/Thunar/uca.xml
    dst: ~/.config/Thunar/uca.xml
    chmod: '600'
  f_vimrc:
    src: vimrc
    dst: ~/.vimrc
  f_xsettingsd.conf:
    src: config/xsettingsd/xsettingsd.conf
    dst: ~/.config/xsettingsd/xsettingsd.conf
  f_zsh_host_mia:
    src: hosts/mia/zsh/host.zsh
    dst: ~/.config/zsh/host.zsh
  f_zshenv:
    src: zshenv
    dst: ~/.zshenv
profiles:
  # Shell and CLI tools, safe on any distro (headless VMs included)
  base:
    dotfiles:
      - f_shell
      - f_bashrc
      - d_zsh
      - f_zshenv
      - d_oh-my-zsh
      - d_config_oh-my-zsh_plugins
      - d_config_oh-my-zsh_themes
      - f_p10k.zsh
      - f_gitconfig
      - d_btop
      - f_htoprc
      - f_config.conf
      - f_pythonrc
      - d_ranger
      - f_vimrc
      - f_plug.vim
      - d_plugged
      - f_extract-audio-streams
      - f_get-iommu-groups
  # Arch Linux only: pacman/AUR tooling
  arch:
    dotfiles:
      - f_aur-audit
  # Hyprland session and GUI applications, no hardware assumptions
  desktop:
    dotfiles:
      - f_gitconfig_desktop
      - f_dmrc
      - d_hypr
      - f_hyprlock-recover
      - f_hypr_xkb_reset
      - f_sunsetr.toml
      - d_waybar
      - d_rofi
      - d_wofi
      - f_config.json
      - d_ulauncher
      - d_ulauncher_themes
      - d_local_share_ulauncher_extensions
      - d_systemd
      - d_gtk-2.0
      - d_gtk-3.0
      - d_qt5ct
      - f_kvantum.kvconfig
      - f_index.theme
      - f_xsettingsd.conf
      - d_xfce4
      - f_uca.xml
      - f_mimeapps.list
      - f_kitty.conf
      - f_keepassxc.ini
      - f_lutris.conf
      - f_prusaslicer.ini
      - f_prusaslicergcodeviewer.ini
      - f_pavucontrol.ini
      - f_code-flags.conf
      - f_electron-flags.conf
      - f_electron13-flags.conf
      - d_blender
      - d_mpv
      - f_qbittorrent.conf
      - f_qbittorrent-natpmp
      - f_flameshot_config
      - f_swappy_config
  # Personal PC: hardware and mounts that only exist here
  mia:
    include:
      - base
      - arch
      - desktop
    dotfiles:
      - d_openrgb
      - f_hypr_host_mia
      - f_hypr_host_mia_hyprlock
      - f_zsh_host_mia
      - f_media-sync-mk3s_mia
