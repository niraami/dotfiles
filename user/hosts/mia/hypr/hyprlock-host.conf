# Host-specific lock screen layout for mia, deployed as ~/.config/hypr/hyprlock-host.conf
# Setting $HOST_LOCK_WIDGETS stops hyprlock.conf from putting widgets on every monitor.
$HOST_LOCK_WIDGETS = 1

# Widgets go on the main monitor: DP-1, or the TV in TV mode (it is disabled
# otherwise). Widgets on a disabled monitor are simply not drawn.
$mon = DP-1
source = ~/.config/hypr/hyprlock-widgets.conf

$mon = HDMI-A-1
source = ~/.config/hypr/hyprlock-widgets.conf
