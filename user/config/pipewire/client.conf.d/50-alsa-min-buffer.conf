# Minimum buffer for apps that use the ALSA API through pipewire-alsa
#
# Some ALSA apps (cpal-based Rust/Tauri apps such as music-assistant-companion)
# ask for a buffer smaller than one graph cycle. When the graph quantum is
# larger (the Scarlett's Pro Audio profile locks it at 1024 frames), the app
# runs dry every cycle: constant underruns, crackle, and warble in apps that
# resync against a clock. Apps asking for more than these minimums are unaffected.
#
# Sizes are in bytes. For float32 stereo (8 B/frame):
# period 8192 B = 1024 frames, buffer 32768 B = 4096 frames (~85 ms at 48 kHz).
alsa.properties = {
    alsa.period-bytes = { min=8192 max=2097152 }
    alsa.buffer-bytes = { min=32768 max=4194304 }
}
