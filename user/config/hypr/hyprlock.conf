general {
  hide_cursor = true
  ignore_empty_input = true
  immediate_render = true
}

background {
  monitor =
  color = rgba(0, 0, 0, 1.0)
}

# Hosts can pick the monitors that get widgets in hyprlock-host.conf
# (user/hosts/<host>/hypr in the dotfiles), it is fine for it to be missing
# hyprlang noerror true
source = ~/.config/hypr/hyprlock-host.conf
# hyprlang noerror false

# No host layout: widgets on every monitor
# hyprlang if !HOST_LOCK_WIDGETS
$mon =
source = ~/.config/hypr/hyprlock-widgets.conf
# hyprlang endif
