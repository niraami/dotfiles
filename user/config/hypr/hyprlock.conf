general {
  hide_cursor = true
  ignore_empty_input = true
  immediate_render = true
}

background {
  monitor =
  color = rgba(0, 0, 0, 1.0)
}

# Widgets go on the main monitor: DP-1, or the TV in TV mode (it is disabled
# otherwise). Widgets on a disabled monitor are simply not drawn.
$mon = DP-1
source = ~/.config/hypr/hyprlock-widgets.conf

$mon = HDMI-A-1
source = ~/.config/hypr/hyprlock-widgets.conf
