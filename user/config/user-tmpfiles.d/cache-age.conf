# Age-based cleanup of regenerable caches (systemd-tmpfiles, user instance).
# Type 'e' = clean an existing directory, never create it. Age = newest of
# atime/mtime/ctime; anything younger is kept. %C = ~/.cache, %h = $HOME.
# Run by systemd-tmpfiles-clean.timer (user), enabled via dotdrop post-action.
#
# Type Path                                  Mode UID GID Age
e %C/thumbnails                              -    -   -   30d
e %C/pip                                     -    -   -   60d
e %C/yarn                                    -    -   -   60d
e %C/winetricks                              -    -   -   90d
e %C/electron                                -    -   -   60d
e %C/blender-benchmark-launcher              -    -   -   60d
# Electron app HTTP caches (rebuilt on demand)
e %h/.config/discord/Cache                   -    -   -   14d
e %h/.config/vesktop/sessionData/Cache       -    -   -   14d
e %h/.config/tidal-hifi/Cache                -    -   -   14d
