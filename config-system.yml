config:
  backup: true
  banner: false
  create: true
  dotpath: system
  keepdot: false
  link_dotfile_default: nolink
  link_on_import: nolink
  longkey: false
  showdiff: true
actions:
  # weekly package cache cleanup, keeps the newest 2 versions (see f_pacman-contrib)
  a_enable-paccache-timer: systemctl enable --now paccache.timer
dotfiles:
  f_bin-hypr:
    src: usr/local/bin/Hypr
    dst: /usr/local/bin/Hypr
    chmod: '755'
  f_bin-sync-files:
    src: usr/local/bin/sync-files
    dst: /usr/local/bin/sync-files
    chmod: '755'
  f_enable-pci-rescan:
    src: usr/local/bin/enable-pci-rescan
    dst: /usr/local/bin/enable-pci-rescan
    chmod: '755'
  f_enable-pci-rescan.service:
    src: etc/systemd/system/enable-pci-rescan.service
    dst: /etc/systemd/system/enable-pci-rescan.service
  f_makepkg.conf:
    src: etc/makepkg.conf
    dst: /etc/makepkg.conf
  f_modprobe-hid_apple.conf:
    src: etc/modprobe.d/hid_apple.conf
    dst: /etc/modprobe.d/hid_apple.conf
  f_modprobe-zfs.conf:
    src: etc/modprobe.d/zfs.conf
    dst: /etc/modprobe.d/zfs.conf
  f_pacman-95-mkinitcpio-mirror.hook:
    src: etc/pacman.d/hooks/95-mkinitcpio-mirror.hook
    dst: /etc/pacman.d/hooks/95-mkinitcpio-mirror.hook
  f_pacman-mkinitcpio-mirror:
    src: etc/pacman.d/hooks.bin/mkinitcpio-mirror
    dst: /etc/pacman.d/hooks.bin/mkinitcpio-mirror
    chmod: '744'
  f_pacman-contrib:
    src: etc/conf.d/pacman-contrib
    dst: /etc/conf.d/pacman-contrib
    actions:
      - a_enable-paccache-timer
  f_pacman.conf:
    src: etc/pacman.conf
    dst: /etc/pacman.conf
  f_reflector.conf:
    src: etc/xdg/reflector/reflector.conf
    dst: /etc/xdg/reflector/reflector.conf
  f_ssh-agent.sh:
    src: etc/profile.d/ssh-agent.sh
    dst: /etc/profile.d/ssh-agent.sh
  f_sshd_config:
    src: etc/ssh/sshd_config
    dst: /etc/ssh/sshd_config
  f_sysctl-90-override.conf:
    src: etc/sysctl.d/90-override.conf
    dst: /etc/sysctl.d/90-override.conf
  f_system-sleep-atlantic-reload:
    src: usr/lib/systemd/system-sleep/atlantic-reload
    dst: /usr/lib/systemd/system-sleep/atlantic-reload
    chmod: '755'
  f_udev-60-cifs-writeback.rules:
    src: etc/udev/rules.d/60-cifs-writeback.rules
    dst: /etc/udev/rules.d/60-cifs-writeback.rules
  f_vconsole.conf:
    src: etc/vconsole.conf
    dst: /etc/vconsole.conf
  f_xorg-00-keyboard.conf:
    src: etc/X11/xorg.conf.d/00-keyboard.conf
    dst: /etc/X11/xorg.conf.d/00-keyboard.conf
  f_zramd-config:
    src: etc/default/zramd
    dst: /etc/default/zramd
profiles:
  # Arch Linux base system, no hardware assumptions
  arch:
    dotfiles:
      - f_makepkg.conf
      - f_pacman-contrib
      - f_pacman.conf
      - f_reflector.conf
      - f_sshd_config
      - f_udev-60-cifs-writeback.rules
      - f_vconsole.conf
      - f_xorg-00-keyboard.conf
  # Hyprland session, pairs with the user config's desktop profile
  desktop:
    dotfiles:
      - f_bin-hypr
      - f_ssh-agent.sh
  # Personal PC: AQC113 NIC, ZFS, mirrored ESPs, zram, Apple keyboard
  mia:
    include:
      - arch
      - desktop
    dotfiles:
      - f_bin-sync-files
      - f_enable-pci-rescan
      - f_enable-pci-rescan.service
      - f_modprobe-hid_apple.conf
      - f_modprobe-zfs.conf
      - f_pacman-95-mkinitcpio-mirror.hook
      - f_pacman-mkinitcpio-mirror
      - f_sysctl-90-override.conf
      - f_system-sleep-atlantic-reload
      - f_zramd-config
